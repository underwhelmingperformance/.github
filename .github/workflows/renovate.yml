name: Renovate

on:
  schedule:
    # Offset by 12 minutes to avoid busy times on the hour.
    - cron: 12 */4 * * *

  pull_request:
    paths:
      - renovate-config.json
      - renovate-config.json5
      - .github/renovate-entrypoint.sh
      - .github/workflows/renovate.yml

  push:
    branches:
      - main
    paths:
      - renovate-config.json
      - renovate-config.json5
      - .github/renovate-entrypoint.sh
      - .github/workflows/renovate.yml

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run Renovate in dry-run mode"
        required: false
        default: false
        type: boolean

      debug:
        description: "Run Renovate in debug mode"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate (${{ matrix.owner }})
    permissions:
      contents: read

    # An installation token covers one account, so each account that has
    # installed the app gets its own Renovate run.
    strategy:
      fail-fast: false
      matrix:
        owner:
          - underwhelmingperformance
          - iainlane

    runs-on: ubuntu-latest
    # The installation token expires after an hour and Renovate cannot
    # renew it, so a longer run would fail once the token expires.
    timeout-minutes: 55

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            renovate-config.json
            renovate-config.json5
            .github/renovate-entrypoint.sh

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.MOVEROFTHINGS_APP_ID }}
          private-key: ${{ secrets.MOVEROFTHINGS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }} # zizmor: ignore[github-app] Renovate autodiscovery needs every repository available to the account's app installation.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@7b402fe76b7bc4273576663a09be2f0f85266e2f # v47.0.0
        with:
          configurationFile: renovate-config.json5
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.257.5@sha256:d57dca79611ee02af29f1243d27956618a291e6364294ea8ae17629b2e66696f
          token: ${{ steps.generate-token.outputs.token }}
          # Install a real Nix into the container before Renovate starts, so
          # post-upgrade tasks that build a flake substitute from cache.nixos.org
          # instead of compiling the toolchain from source. The script starts
          # as root to install the package and write /etc/nix, then runs
          # Renovate as the image's unprivileged user.
          docker-cmd-file: .github/renovate-entrypoint.sh
          docker-user: root
        env:
          LOG_LEVEL:
            ${{ ((github.event_name == 'workflow_dispatch' && inputs.debug) ||
            (github.event_name == 'pull_request')) && 'debug' || 'info' }}
          # Repositories opt in to `postUpgradeTasks` in their own Renovate
          # config; only commands matching this list may run. Any bare pnpm
          # script is allowed, with no arguments or shell metacharacters, and
          # so is the repository's own .github/renovate-post-upgrade.bash.
          RENOVATE_ALLOWED_COMMANDS: '["^pnpm [A-Za-z0-9:._-]+$", "^bash \\.github/renovate-post-upgrade\\.bash$"]'
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: ${{ matrix.owner }}/*
          RENOVATE_DRY_RUN:
            ${{ (github.event_name == 'pull_request' || (github.event_name ==
            'workflow_dispatch' && github.event.inputs.dry-run == 'true')) &&
            'full' || null }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_REQUIRE_CONFIG: optional
